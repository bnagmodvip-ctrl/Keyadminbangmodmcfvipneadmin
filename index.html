<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>C.BANGVMOD ADMIN</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#030507;
    color:#fff;
}

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#241008,#030507 55%);
}

.loginBox{
    width:100%;
    max-width:400px;
    padding:25px;
    background:#080c10;
    border:1px solid #ff7a00;
    border-radius:20px;
    box-shadow:0 0 40px rgba(255,122,0,.16);
    text-align:center;
}

.logo{
    color:#ff7a00;
    font-size:26px;
    font-weight:1000;
    text-shadow:0 0 15px rgba(255,122,0,.6);
}

.sub{
    color:#697585;
    font-size:10px;
    margin:7px 0 20px;
}

.loginInput,
.adminInput,
.adminSelect{
    width:100%;
    padding:13px;
    background:#030507;
    color:#fff;
    border:1px solid #25313b;
    border-radius:10px;
    outline:none;
    margin-bottom:10px;
}

.loginInput:focus,
.adminInput:focus,
.adminSelect:focus{
    border-color:#ff7a00;
}

.loginButton,
.createButton{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#ff7a00;
    color:#180900;
    font-weight:1000;
    cursor:pointer;
}

#loginError{
    color:#ff4040;
    font-size:11px;
    margin-top:10px;
    font-weight:bold;
}

#adminPanel{
    display:none;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(3,5,7,.95);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #21160e;
}

.headerInner{
    max-width:1100px;
    margin:auto;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    color:#ff7a00;
    font-weight:1000;
    font-size:20px;
}

.logout{
    padding:8px 11px;
    border:1px solid #36251a;
    background:#090b0d;
    color:#aaa;
    border-radius:8px;
    font-size:10px;
    font-weight:bold;
}

.container{
    width:calc(100% - 24px);
    max-width:1000px;
    margin:25px auto;
}

.panel{
    background:#080c10;
    border:1px solid #19242c;
    border-radius:16px;
    padding:17px;
    margin-bottom:15px;
}

.panel h2{
    color:#ff7a00;
    font-size:17px;
    margin-bottom:14px;
}

.keyPreview{
    background:#020406;
    border:1px dashed #33404a;
    border-radius:10px;
    padding:13px;
    margin-bottom:10px;
    color:#00eaff;
    font-weight:1000;
    text-align:center;
    word-break:break-all;
}

.generateButton{
    width:100%;
    padding:12px;
    background:#10171c;
    color:#00eaff;
    border:1px solid #17313a;
    border-radius:10px;
    font-weight:1000;
    margin-bottom:10px;
}

.keyList{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.keyCard{
    background:#05080a;
    border:1px solid #18252d;
    border-radius:13px;
    padding:13px;
}

.keyValue{
    color:#00eaff;
    font-size:13px;
    font-weight:1000;
    word-break:break-all;
}

.note{
    color:#fff;
    font-size:11px;
    margin-top:8px;
}

.meta{
    color:#667585;
    font-size:10px;
    margin-top:7px;
}

.active{
    color:#00ff66;
}

.deleted{
    color:#ff4040;
}

.keyActions{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.deleteButton{
    flex:1;
    padding:10px;
    background:#170707;
    border:1px solid #411212;
    color:#ff4545;
    border-radius:8px;
    font-weight:1000;
}

.copyButton{
    flex:1;
    padding:10px;
    background:#07151a;
    border:1px solid #12343d;
    color:#00eaff;
    border-radius:8px;
    font-weight:1000;
}

.empty{
    text-align:center;
    color:#5d6975;
    font-size:11px;
    padding:20px;
}
</style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="logo">
            C.BANGVMOD ADMIN
        </div>

        <div class="sub">
            QUẢN LÝ KEY WEBSITE
        </div>

        <input
            id="adminPassword"
            class="loginInput"
            type="password"
            placeholder="Mật khẩu Admin..."
        >

        <button
            id="loginButton"
            class="loginButton"
        >
            🔐 ĐĂNG NHẬP ADMIN
        </button>

        <div id="loginError"></div>

    </div>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminPanel">

<header>

    <div class="headerInner">

        <div class="brand">
            ⚡ C.BANGVMOD ADMIN
        </div>

        <button
            id="logoutButton"
            class="logout"
        >
            🚪 ĐĂNG XUẤT
        </button>

    </div>

</header>


<main class="container">


<!-- CREATE KEY -->

<section class="panel">

    <h2>🔑 TẠO KEY MỚI</h2>

    <input
        id="customKey"
        class="adminInput"
        placeholder="KEY tùy chỉnh (để trống = tự tạo)"
        autocomplete="off"
    >

    <input
        id="keyNote"
        class="adminInput"
        placeholder="Ghi chú KEY, ví dụ: Chào mừng đến với website!"
        autocomplete="off"
    >

    <select
        id="maxUses"
        class="adminSelect"
    >
        <option value="1">
            1 lượt sử dụng
        </option>

        <option value="2">
            2 lượt sử dụng
        </option>

        <option value="5">
            5 lượt sử dụng
        </option>

        <option value="10">
            10 lượt sử dụng
        </option>

        <option value="999999">
            Không giới hạn
        </option>
    </select>

    <div
        id="keyPreview"
        class="keyPreview"
    >
        KEY sẽ xuất hiện ở đây
    </div>

    <button
        id="generateButton"
        class="generateButton"
    >
        🎲 TẠO KEY NGẪU NHIÊN
    </button>

    <button
        id="createButton"
        class="createButton"
    >
        ➕ TẠO KEY
    </button>

</section>


<!-- KEY LIST -->

<section class="panel">

    <h2>
        📋 DANH SÁCH KEY
    </h2>

    <div
        id="keyList"
        class="keyList"
    >
        <div class="empty">
            Đang tải KEY...
        </div>
    </div>

</section>


</main>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    serverTimestamp,
    doc,
    runTransaction
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ================= FIREBASE ================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDUzh9rJblwABf_v-S9JZAkrVZKEsT-WOU",

    authDomain:
        "phune-31284.firebaseapp.com",

    projectId:
        "phune-31284",

    storageBucket:
        "phune-31284.firebasestorage.app",

    messagingSenderId:
        "395938850354",

    appId:
        "1:395938850354:web:3f99d9c17343604739be2b",

    measurementId:
        "G-BDDQJW8MEL"
};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* ================= ADMIN PASSWORD ================= */

const ADMIN_PASSWORD =
    "BANGMCMODADMINholakdjjzhuns";


/* ================= DOM ================= */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const adminPanel =
    document.getElementById(
        "adminPanel"
    );

const adminPassword =
    document.getElementById(
        "adminPassword"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const loginError =
    document.getElementById(
        "loginError"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );

const customKey =
    document.getElementById(
        "customKey"
    );

const keyNote =
    document.getElementById(
        "keyNote"
    );

const maxUses =
    document.getElementById(
        "maxUses"
    );

const keyPreview =
    document.getElementById(
        "keyPreview"
    );

const generateButton =
    document.getElementById(
        "generateButton"
    );

const createButton =
    document.getElementById(
        "createButton"
    );

const keyList =
    document.getElementById(
        "keyList"
    );


/* ================= LOGIN ================= */

loginButton.addEventListener(
    "click",
    ()=>{

        if(
            adminPassword.value ===
            ADMIN_PASSWORD
        ){

            loginScreen.style.display =
                "none";

            adminPanel.style.display =
                "block";

            sessionStorage.setItem(
                "cbang_admin",
                "1"
            );

        }else{

            loginError.textContent =
                "❌ Sai mật khẩu Admin!";

            adminPassword.value = "";

            adminPassword.focus();
        }
    }
);


adminPassword.addEventListener(
    "keydown",
    e=>{

        if(e.key === "Enter"){
            loginButton.click();
        }
    }
);


/* ================= AUTO LOGIN SESSION ================= */

if(
    sessionStorage.getItem(
        "cbang_admin"
    ) === "1"
){

    loginScreen.style.display =
        "none";

    adminPanel.style.display =
        "block";
}


/* ================= LOGOUT ================= */

logoutButton.addEventListener(
    "click",
    ()=>{

        sessionStorage.removeItem(
            "cbang_admin"
        );

        location.reload();
    }
);


/* ================= GENERATE KEY ================= */

function randomKey(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result =
        "BANGMC-";

    for(
        let i=0;
        i<16;
        i++
    ){

        result +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];
    }

    return result;
}


function updatePreview(){

    const value =
        customKey.value.trim();

    keyPreview.textContent =
        value ||
        "KEY sẽ xuất hiện ở đây";
}


generateButton.addEventListener(
    "click",
    ()=>{

        customKey.value =
            randomKey();

        updatePreview();
    }
);


customKey.addEventListener(
    "input",
    updatePreview
);


/* ================= CREATE KEY ================= */

createButton.addEventListener(
    "click",
    async()=>{

        let key =
            customKey.value.trim();

        const note =
            keyNote.value.trim();

        const uses =
            Number(
                maxUses.value
            );


        if(!key){

            key =
                randomKey();

            customKey.value =
                key;

            updatePreview();
        }


        if(!note){

            alert(
                "❌ Vui lòng nhập ghi chú KEY!"
            );

            keyNote.focus();

            return;
        }


        createButton.disabled =
            true;

        createButton.textContent =
            "⏳ ĐANG TẠO...";


        try{

            await addDoc(
                collection(
                    db,
                    "website_keys"
                ),
                {

                    key:key,

                    note:note,

                    maxUses:uses,

                    usedCount:0,

                    active:true,

                    createdAt:
                        serverTimestamp()
                }
            );


            alert(
                "✅ Tạo KEY thành công!\n\n" +
                "KEY: " + key +
                "\n\nGhi chú: " + note
            );


            customKey.value = "";

            keyNote.value = "";

            keyPreview.textContent =
                "KEY sẽ xuất hiện ở đây";


        }catch(error){

            console.error(error);

            alert(
                "❌ Không thể tạo KEY!"
            );

        }finally{

            createButton.disabled =
                false;

            createButton.textContent =
                "➕ TẠO KEY";
        }
    }
);


/* ================= ESCAPE ================= */

function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ================= COPY ================= */

window.copyKey =
async function(key){

    try{

        await navigator.clipboard.writeText(
            key
        );

        alert(
            "✅ Đã copy KEY!"
        );

    }catch{

        prompt(
            "Copy KEY:",
            key
        );
    }
};


/* ================= DELETE / DISABLE ================= */

window.deleteKey =
async function(id){

    if(
        !confirm(
            "Bạn có chắc muốn xóa KEY này không?\n\n" +
            "KEY sẽ được vô hiệu hóa và người dùng sẽ thấy:\n" +
            "🗑️ KEY này đã bị xóa!"
        )
    ){

        return;
    }


    try{

        await runTransaction(
            db,
            async(transaction)=>{

                const keyRef =
                    doc(
                        db,
                        "website_keys",
                        id
                    );

                transaction.update(
                    keyRef,
                    {

                        active:false,

                        deletedAt:
                            serverTimestamp()
                    }
                );
            }
        );


        alert(
            "🗑️ Đã xóa/vô hiệu hóa KEY!"
        );

    }catch(error){

        console.error(error);

        alert(
            "❌ Không thể xóa KEY!"
        );
    }
};


/* ================= REALTIME KEY LIST ================= */

const keysQuery =
    collection(
        db,
        "website_keys"
    );


onSnapshot(
    keysQuery,
    snapshot=>{

        keyList.innerHTML = "";


        if(snapshot.empty){

            keyList.innerHTML =
                `<div class="empty">
                    Chưa có KEY nào.
                </div>`;

            return;
        }


        const docs =
            snapshot.docs
                .sort(
                    (a,b)=>{

                        const ta =
                            a.data().createdAt
                                ?.seconds || 0;

                        const tb =
                            b.data().createdAt
                                ?.seconds || 0;

                        return tb-ta;
                    }
                );


        docs.forEach(
            keyDoc=>{

                const data =
                    keyDoc.data();

                const max =
                    Number(
                        data.maxUses || 1
                    );

                const used =
                    Number(
                        data.usedCount || 0
                    );

                const active =
                    data.active !== false;


                const status =
                    active
                    ? `<span class="active">
                        🟢 ĐANG HOẠT ĐỘNG
                       </span>`
                    : `<span class="deleted">
                        🗑️ ĐÃ XÓA
                       </span>`;


                const usesText =
                    max >= 999999
                    ? `${used} / ∞`
                    : `${used} / ${max}`;


                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "keyCard";


                card.innerHTML = `

                    <div class="keyValue">
                        🔑 ${escapeHTML(data.key)}
                    </div>

                    <div class="note">
                        💬 ${escapeHTML(
                            data.note ||
                            "Không có ghi chú"
                        )}
                    </div>

                    <div class="meta">
                        📊 Lượt dùng:
                        ${usesText}
                    </div>

                    <div class="meta">
                        Trạng thái:
                        ${status}
                    </div>

                    <div class="keyActions">

                        <button
                            class="copyButton"
                            onclick="copyKey(
                                '${String(data.key)
                                    .replace(/'/g,"\\'")}'
                            )"
                        >
                            📋 COPY KEY
                        </button>

                        ${
                            active
                            ?
                            `<button
                                class="deleteButton"
                                onclick="deleteKey(
                                    '${keyDoc.id}'
                                )"
                            >
                                🗑️ XÓA KEY
                            </button>`
                            :
                            `<button
                                class="deleteButton"
                                disabled
                                style="opacity:.35"
                            >
                                🗑️ ĐÃ XÓA
                            </button>`
                        }

                    </div>
                `;


                keyList.appendChild(
                    card
                );
            }
        );
    }
);

</script>

</body>
</html>
