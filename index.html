<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>C.BANGVMOD ADMIN</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#030507;
    color:#fff;
}

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#241008,#030507 55%);
}

.loginBox{
    width:100%;
    max-width:400px;
    padding:25px;
    background:#080c10;
    border:1px solid #ff7a00;
    border-radius:20px;
    box-shadow:0 0 40px rgba(255,122,0,.16);
    text-align:center;
}

.logo{
    color:#ff7a00;
    font-size:26px;
    font-weight:1000;
    text-shadow:0 0 15px rgba(255,122,0,.6);
}

.sub{
    color:#697585;
    font-size:10px;
    margin:7px 0 20px;
}

.loginInput,
.adminInput,
.adminSelect{
    width:100%;
    padding:13px;
    background:#030507;
    color:#fff;
    border:1px solid #25313b;
    border-radius:10px;
    outline:none;
    margin-bottom:10px;
}

.loginInput:focus,
.adminInput:focus,
.adminSelect:focus{
    border-color:#ff7a00;
}

.loginButton,
.createButton{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#ff7a00;
    color:#180900;
    font-weight:1000;
    cursor:pointer;
}

#loginError{
    color:#ff4040;
    font-size:11px;
    margin-top:10px;
    font-weight:bold;
}

#adminPanel{
    display:none;
}

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(3,5,7,.95);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #21160e;
}

.headerInner{
    max-width:1100px;
    margin:auto;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.headerTitle{
    color:#ff7a00;
    font-size:20px;
    font-weight:1000;
}

.headerSub{
    color:#68717b;
    font-size:9px;
    margin-top:3px;
}

.logout{
    border:1px solid #39261a;
    background:#0a0d10;
    color:#ff7a00;
    padding:9px 13px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:20px 15px 50px;
}

.card{
    background:#080c10;
    border:1px solid #1d2730;
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
}

.cardTitle{
    color:#ff7a00;
    font-weight:1000;
    font-size:15px;
    margin-bottom:14px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:#080c10;
    border:1px solid #1d2730;
    border-radius:15px;
    padding:18px;
}

.statName{
    color:#697585;
    font-size:10px;
    font-weight:bold;
}

.statValue{
    color:#fff;
    font-size:25px;
    font-weight:1000;
    margin-top:7px;
}

.keyList{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.keyItem{
    background:#030507;
    border:1px solid #1d2730;
    border-radius:12px;
    padding:13px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.keyCode{
    color:#ff9a45;
    font-size:14px;
    font-weight:1000;
    word-break:break-all;
}

.keyInfo{
    color:#697585;
    font-size:9px;
    margin-top:5px;
}

.deleteBtn{
    flex-shrink:0;
    border:1px solid #562020;
    background:#170909;
    color:#ff4b4b;
    padding:8px 11px;
    border-radius:8px;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

.empty{
    color:#697585;
    text-align:center;
    padding:25px;
    font-size:12px;
}

.message{
    margin-top:10px;
    padding:10px;
    border-radius:9px;
    display:none;
    font-size:11px;
    font-weight:bold;
}

.success{
    display:block;
    background:#08200f;
    border:1px solid #164c29;
    color:#45e889;
}

.error{
    display:block;
    background:#220909;
    border:1px solid #572020;
    color:#ff5555;
}

.search{
    margin-bottom:12px;
}

.refresh{
    border:1px solid #26333d;
    background:#0a0d10;
    color:#fff;
    padding:10px 13px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
    margin-bottom:12px;
}

@media(max-width:650px){
    .grid,
    .stats{
        grid-template-columns:1fr;
    }

    .headerInner{
        padding:12px;
    }
}
</style>
</head>

<body>

<div id="loginScreen">

    <div class="loginBox">

        <div class="logo">
            C.BANGVMOD ADMIN
        </div>

        <div class="sub">
            QUẢN LÝ KEY • TẠO KEY • XÓA KEY
        </div>

        <input
            id="adminPassword"
            class="loginInput"
            type="password"
            placeholder="Nhập key Admin..."
            autocomplete="off"
        >

        <button
            class="loginButton"
            onclick="loginAdmin()"
        >
            ĐĂNG NHẬP ADMIN
        </button>

        <div id="loginError"></div>

    </div>

</div>


<div id="adminPanel">

<header>

    <div class="headerInner">

        <div>
            <div class="headerTitle">
                C.BANGVMOD ADMIN
            </div>

            <div class="headerSub">
                HỆ THỐNG QUẢN LÝ KEY
            </div>
        </div>

        <button
            class="logout"
            onclick="logoutAdmin()"
        >
            ĐĂNG XUẤT
        </button>

    </div>

</header>


<div class="container">

    <div class="stats">

        <div class="stat">
            <div class="statName">
                TỔNG KEY
            </div>

            <div
                class="statValue"
                id="totalKeys"
            >
                0
            </div>
        </div>


        <div class="stat">
            <div class="statName">
                KEY ĐANG HIỂN THỊ
            </div>

            <div
                class="statValue"
                id="shownKeys"
            >
                0
            </div>
        </div>


        <div class="stat">
            <div class="statName">
                TRẠNG THÁI ADMIN
            </div>

            <div
                class="statValue"
                style="font-size:16px;color:#45e889"
            >
                ONLINE
            </div>
        </div>

    </div>


    <div class="card">

        <div class="cardTitle">
            🔑 TẠO KEY MỚI
        </div>

        <div class="grid">

            <input
                id="keyInput"
                class="adminInput"
                placeholder="Nhập key, ví dụ: BANGVIP001"
                autocomplete="off"
            >

            <select
                id="keyType"
                class="adminSelect"
            >
                <option value="vip">
                    VIP
                </option>

                <option value="normal">
                    NORMAL
                </option>

                <option value="admin">
                    ADMIN
                </option>
            </select>

        </div>

        <button
            class="createButton"
            onclick="createKey()"
        >
            + TẠO KEY
        </button>

        <div
            id="createMessage"
            class="message"
        ></div>

    </div>


    <div class="card">

        <div class="cardTitle">
            📋 DANH SÁCH KEY
        </div>

        <input
            id="searchInput"
            class="adminInput search"
            placeholder="Tìm kiếm key..."
            oninput="renderKeys()"
        >

        <button
            class="refresh"
            onclick="loadKeys()"
        >
            ↻ LÀM MỚI
        </button>

        <div
            id="keyList"
            class="keyList"
        >
            <div class="empty">
                Đang tải dữ liệu...
            </div>
        </div>

    </div>

</div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDUzh9rJblwABf_v-S9JZAkrVZKEsT-WOU",

    authDomain:
        "phune-31284.firebaseapp.com",

    projectId:
        "phune-31284",

    storageBucket:
        "phune-31284.firebasestorage.app",

    messagingSenderId:
        "395938850354",

    appId:
        "1:395938850354:web:3f99d9c17343604739be2b",

    measurementId:
        "G-BDDQJW8MEL"

};


const app =
    initializeApp(firebaseConfig);

const db =
    getFirestore(app);


/* KEY ADMIN */

const ADMIN_KEY =
    "BANGMODVIPMCADMIN";


/* COLLECTION */

const KEY_COLLECTION =
    "keys";


let allKeys = [];


/* LOGIN */

window.loginAdmin = function(){

    const input =
        document
        .getElementById("adminPassword")
        .value
        .trim();

    const error =
        document
        .getElementById("loginError");


    if(input === ADMIN_KEY){

        sessionStorage.setItem(
            "cbang_admin_login",
            "true"
        );

        error.innerText = "";

        document
        .getElementById("loginScreen")
        .style.display = "none";

        document
        .getElementById("adminPanel")
        .style.display = "block";

        loadKeys();

    }else{

        error.innerText =
            "❌ Key Admin không chính xác!";

    }

};


/* AUTO LOGIN */

if(
    sessionStorage.getItem(
        "cbang_admin_login"
    ) === "true"
){

    document
    .getElementById("loginScreen")
    .style.display = "none";

    document
    .getElementById("adminPanel")
    .style.display = "block";

    loadKeys();

}


/* LOGOUT */

window.logoutAdmin = function(){

    sessionStorage.removeItem(
        "cbang_admin_login"
    );

    location.reload();

};


/* TẠO KEY */

window.createKey = async function(){

    const input =
        document
        .getElementById("keyInput");

    const type =
        document
        .getElementById("keyType")
        .value;

    const message =
        document
        .getElementById("createMessage");

    const key =
        input.value.trim();


    if(!key){

        showMessage(
            message,
            "❌ Vui lòng nhập key!",
            "error"
        );

        return;

    }


    if(key.length < 4){

        showMessage(
            message,
            "❌ Key phải có ít nhất 4 ký tự!",
            "error"
        );

        return;

    }


    try{

        const existing =
            allKeys.find(
                item =>
                    String(item.key || "")
                    .toLowerCase()
                    === key.toLowerCase()
            );


        if(existing){

            showMessage(
                message,
                "❌ Key này đã tồn tại!",
                "error"
            );

            return;

        }


        await addDoc(
            collection(
                db,
                KEY_COLLECTION
            ),
            {

                key:key,

                type:type,

                active:true,

                createdAt:
                    new Date()
                    .toISOString()

            }
        );


        input.value = "";


        showMessage(
            message,
            "✅ Tạo key thành công: " + key,
            "success"
        );


        await loadKeys();


    }catch(error){

        console.error(error);

        showMessage(
            message,
            "❌ Không thể tạo key. Kiểm tra Firestore Rules.",
            "error"
        );

    }

};


/* LOAD KEY */

window.loadKeys = async function(){

    const list =
        document
        .getElementById("keyList");


    list.innerHTML =
        '<div class="empty">Đang tải...</div>';


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    KEY_COLLECTION
                )
            );


        allKeys = [];


        snapshot.forEach(item => {

            allKeys.push({

                id:item.id,

                ...item.data()

            });

        });


        allKeys.sort(
            (a,b) =>
                String(
                    b.createdAt || ""
                )
                .localeCompare(
                    String(
                        a.createdAt || ""
                    )
                )
        );


        document
        .getElementById("totalKeys")
        .innerText =
            allKeys.length;


        renderKeys();


    }catch(error){

        console.error(error);

        list.innerHTML = `

            <div class="empty">

                ❌ Không thể tải key.

                <br><br>

                Kiểm tra Firestore Rules
                và collection "keys".

            </div>

        `;

    }

};


/* HIỂN THỊ KEY */

window.renderKeys = function(){

    const list =
        document
        .getElementById("keyList");


    const search =
        document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();


    const filtered =
        allKeys.filter(
            item =>
                String(
                    item.key || ""
                )
                .toLowerCase()
                .includes(search)
        );


    document
    .getElementById("shownKeys")
    .innerText =
        filtered.length;


    if(filtered.length === 0){

        list.innerHTML = `

            <div class="empty">
                Không có key nào.
            </div>

        `;

        return;

    }


    list.innerHTML = "";


    filtered.forEach(item => {

        const div =
            document.createElement("div");


        div.className =
            "keyItem";


        const created =
            item.createdAt
            ? new Date(
                item.createdAt
              ).toLocaleString("vi-VN")
            : "Không rõ";


        div.innerHTML = `

            <div>

                <div class="keyCode">
                    ${escapeHTML(
                        item.key || ""
                    )}
                </div>

                <div class="keyInfo">

                    Loại:
                    ${escapeHTML(
                        item.type || "normal"
                    )}

                    •

                    Trạng thái:
                    ${
                        item.active !== false
                        ? "ACTIVE"
                        : "DISABLED"
                    }

                    •

                    ${escapeHTML(created)}

                </div>

            </div>


            <button
                class="deleteBtn"
                onclick="deleteKey('${item.id}')"
            >
                XÓA
            </button>

        `;


        list.appendChild(div);

    });

};


/* XÓA KEY */

window.deleteKey = async function(id){

    const item =
        allKeys.find(
            x => x.id === id
        );


    if(!item){
        return;
    }


    const ok =
        confirm(
            "Bạn có chắc muốn xóa key:\n\n"
            + item.key
            + "\n\nKhông thể hoàn tác!"
        );


    if(!ok){
        return;
    }


    try{

        await deleteDoc(
            doc(
                db,
                KEY_COLLECTION,
                id
            )
        );


        await loadKeys();


    }catch(error){

        console.error(error);

        alert(
            "Không thể xóa key. Kiểm tra Firestore Rules."
        );

    }

};


/* THÔNG BÁO */

function showMessage(
    element,
    text,
    type
){

    element.innerText =
        text;

    element.className =
        "message " + type;


    setTimeout(() => {

        element.className =
            "message";

    },4000);

}


/* CHỐNG HTML */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

</script>

</body>
</html>
